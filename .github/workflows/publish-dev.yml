name: publish-dev

on:
  pull_request:
    types: [closed]
    branches: [ dev ]

permissions:
  contents: read
  packages: write

jobs:
  prerelease:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Add GitHub Packages feed
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          --name github \
          --username github \
          --password "${{ secrets.GITHUB_TOKEN }}" \
          --store-password-in-clear-text
      
      - name: Determine prerelease type
        id: prerelease
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'

          if echo "$LABELS" | grep -q '"alpha"'; then
            echo "type=alpha" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q '"beta"'; then
            echo "type=beta" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q '"rc"'; then
            echo "type=rc" >> $GITHUB_OUTPUT
          else
            echo "❌ Missing prerelease label (alpha | beta | rc)"
            exit 1
          fi
    
      - name: Set prerelease version
        id: version
        run: |
          BASE_VERSION="0.1.0"
          TYPE="${{ steps.prerelease.outputs.type }}"
          VERSION="${BASE_VERSION}-${TYPE}.${{ github.run_number }}"
          echo "pkg_version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore CaseFlowClient/CaseFlowClient.sln

      - name: Build
        run: dotnet build CaseFlowClient/CaseFlowClient.sln -c Release --no-restore

      - name: Pack
        run: dotnet pack CaseFlowClient/CaseFlowClient/CaseFlowClient.csproj \
          -c Release \
          -o ./artifacts \
          -p:PackageVersion=${{ steps.version.outputs.pkg_version }}

      - name: Push
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
